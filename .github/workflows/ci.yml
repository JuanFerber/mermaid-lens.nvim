name: CI

on:
  push:
    branches: [main, JuanFerber]
  pull_request:
    branches: [main, JuanFerber]

jobs:
  test:
    name: Headless Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Neovim (v0.10.2)
        run: |
          curl -sSL -o nvim.tar.gz https://github.com/neovim/neovim/releases/download/v0.10.2/nvim-linux64.tar.gz
          tar -xzf nvim.tar.gz
          echo "$PWD/nvim-linux64/bin" >> $GITHUB_PATH

      - name: Verify Neovim installation
        run: nvim --version

      - name: Run automated test suite
        run: nvim --headless -u NONE -l tests/run_tests.lua
